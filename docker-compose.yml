# docker-compose.yml
# ==============================================================================
# Dayflow HRMS - Development Docker Compose Topology
# Services: app (backend), web (nginx + frontend), db (PostgreSQL 15), redis (cache), migrate (seeder)
# ==============================================================================

version: '3.8'

networks:
  hrms-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Isolated Internal Network)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: dayflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dayflow_hrms
      POSTGRES_USER: dayflow_admin
      POSTGRES_PASSWORD: dev_password_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hrms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow_admin -d dayflow_hrms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Redis In-Memory Cache Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dayflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - hrms-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Backend Application API Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dayflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://dayflow_admin:dev_password_123@db:5432/dayflow_hrms?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_super_secret_jwt_key_dayflow_enter_at_least_32_characters
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:80
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hrms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 4. Database Seeding & Migration Service (One-off Execution)
  # ----------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dayflow-migrate
    command: ["node", "src/data/seed.js"]
    environment:
      DATABASE_URL: postgresql://dayflow_admin:dev_password_123@db:5432/dayflow_hrms?schema=public
      JWT_SECRET: dev_super_secret_jwt_key_dayflow_enter_at_least_32_characters
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hrms-network
    restart: "no"

  # ----------------------------------------------------------------------------
  # 5. Frontend & Edge Reverse Proxy (Web Server)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dayflow-web
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - hrms-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
